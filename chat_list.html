<ul id="chat-list" class="space-y-0.5" {% if oob %}hx-swap-oob="true"{% endif %}>
    {% for c in chats %}
    <li class="group relative">
        <a href="/chat/{{ c.id }}"
           class="block truncate rounded-lg py-2 pl-3 pr-9 text-sm transition {% if c.id == chat_id %}bg-blue-50 font-medium text-blue-700{% else %}text-slate-700 hover:bg-slate-100{% endif %}">{{ c.title }}</a>
        <button type="button"
                hx-delete="/chat/{{ c.id }}" hx-confirm="Bu söhbət silinsin?" hx-target="closest li" hx-swap="outerHTML"
                aria-label="Söhbəti sil" title="Sil"
                class="absolute right-1.5 top-1/2 -translate-y-1/2 rounded-md p-1 text-slate-400 transition hover:bg-slate-200 hover:text-red-600 focus:opacity-100 md:opacity-0 md:group-hover:opacity-100">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
            </svg>
        </button>
    </li>
    {% else %}
    <li class="px-3 py-2 text-sm text-slate-400">Hələ söhbət yoxdur</li>
    {% endfor %}
</ul>
